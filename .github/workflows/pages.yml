# The web site (doc/) is built by doc/build.py from the Markdown files and
# published with GitHub Pages. In the settings of the repository, Pages has
# the source "GitHub Actions". A pull request only builds the site, so a broken
# link or page is found before the merge.
name: Pages

on:
  push:
    branches: [master]
    paths: ['doc/**', 'data/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['doc/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: doc/requirements.txt
      - run: pip install -r doc/requirements.txt
      - run: python3 doc/build.py -o build-site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build-site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
