# Builds the image of the CI jobs (.github/ci/Dockerfile) and publishes it to
# ghcr.io, so the jobs of ci.yml do not install the system again on every run.
# Two images: Ubuntu (amd64) and Alpine (arm64, built on a native runner).
# After the first publish set the visibility of the package to public (the
# settings of the package on GitHub), otherwise pull requests from forks
# cannot pull it.
name: CI image

on:
  push:
    paths: ['.github/ci/**', '.github/workflows/ci-image.yml']
  pull_request:
    paths: ['.github/ci/**', '.github/workflows/ci-image.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build the image (${{ matrix.tag }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: noble, dockerfile: Dockerfile, runner: ubuntu-24.04}
          - {tag: alpine-3.22, dockerfile: Dockerfile.alpine, runner: ubuntu-24.04-arm}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        # a pull request only builds the image, it does not publish it
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .github/ci
          file: .github/ci/${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/ondratu/tiny-shell-ci:${{ matrix.tag }}
          pull: true
