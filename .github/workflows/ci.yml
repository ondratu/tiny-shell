# Every job builds with STRICT=1 (warnings are errors) and runs the tests
# under Xvfb (make check). The same commands work locally, see doc/developers/testing.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRICT: 1
  DEBIAN_FRONTEND: noninteractive
  DEPS: build-essential pkg-config libx11-dev libxft-dev libxrender-dev libxext-dev libxrandr-dev libxinerama-dev
        libfontconfig-dev xvfb xauth libgtest-dev libpam0g-dev

jobs:
  pre-commit:
    name: pre-commit (format, spelling, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: pipx install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  lint:
    name: clang-tidy 22 (checks)
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy 22 and the dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
              sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" |
              sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22 $DEPS
      - run: make lint-fast CLANG_TIDY=clang-tidy-22

  analyze:
    name: clang-tidy 22 (analyzer)
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy 22 and the dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
              sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" |
              sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-tidy-22 $DEPS
      - run: make lint-analyze CLANG_TIDY=clang-tidy-22

  cppcheck:
    name: cppcheck
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cppcheck $DEPS
      - run: make cppcheck

  build:
    name: ${{ matrix.name }}
    needs: pre-commit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
            packages: ""
          - name: Clang 19 (the oldest we support)
            cxx: clang++-19
            packages: clang-19
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $DEPS ccache ${{ matrix.packages }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ matrix.cxx }}
      - name: Build and test
        run: |
          make -j$(nproc) CXX="ccache ${{ matrix.cxx }}" all check examples

  asan:
    name: ASan + UBSan
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $DEPS ccache clang-19 llvm-19
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: asan
      - run: make CXX="ccache clang++-19" asan

  alpine:
    needs: pre-commit
    # musl instead of glibc, the libc of small embedded systems: finds code that
    # relies on GNU extensions.
    name: Alpine (musl), Clang
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
      - run: >
          apk add --no-cache git make pkgconf clang g++ libx11-dev libxext-dev libxft-dev
          libxrender-dev libxrandr-dev libxinerama-dev fontconfig-dev linux-pam-dev gtest-dev xvfb xvfb-run xauth font-dejavu
      - uses: actions/checkout@v7
      - run: make CXX=clang++ all check examples

  netbsd:
    name: NetBSD
    needs: pre-commit
    runs-on: ubuntu-24.04
    # Best effort: NetBSD is the BSD for small and old hardware, but the VM is
    # slow and the package set changes, so a failure here does not block a
    # merge.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the VM
        uses: cross-platform-actions/action@v1
        with:
          operating_system: netbsd
          version: "11.0"
          # boots the kernel directly: about twice as fast as the default
          variant: microvm
          shell: sh
          environment_variables: STRICT
      - name: Build and test in the VM
        # cpa.sh runs the commands inside the VM
        shell: cpa.sh {0}
        run: |
          # X11 (with Xft and Xvfb) is a part of the base system, the rest
          # comes from pkgsrc
          export PATH=/usr/pkg/bin:/usr/pkg/sbin:/usr/X11R7/bin:$PATH
          export PKG_CONFIG_PATH=/usr/X11R7/lib/pkgconfig:/usr/pkg/lib/pkgconfig
          sudo pkgin -y install gmake pkgconf googletest
          # in the background with redirected output, otherwise the SSH
          # session of the VM never ends
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          xvfb=$!
          sleep 2
          rc=0
          DISPLAY=:99 gmake XVFB_RUN= all check examples || rc=$?
          kill $xvfb
          exit $rc

  coverage:
    needs: pre-commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # to comment the table on a pull request
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $DEPS
      - name: Measure (gcov needs GCC)
        run: make CXX=g++ coverage | tee coverage.txt
      - name: Make the table
        run: |
          {
            echo "### Test coverage of lib/"
            echo
            echo "| File | Statements | Missed | Covered |"
            echo "|---|--:|--:|--:|"
            awk '/^Name /{t=1; next} /^-+$/{next}
                 t && $1 == "TOTAL" {printf "| **%s** | **%s** | **%s** | **%s** |\n", $1, $2, $3, $4; next}
                 t && NF == 4 {printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' coverage.txt
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the table on the pull request
        # Not for pushes (there is no pull request) and not for forks (their
        # token cannot write); the summary of the run has the table anyway.
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }}
          --edit-last --create-if-none --body-file coverage.md
      - name: The coverage must not go below the threshold
        # A ratchet: raise the number when the coverage grows, never lower it.
        run: |
          min=95
          total=$(awk '/^TOTAL/ {gsub("%", "", $4); print $4}' coverage.txt)
          echo "coverage ${total} % (minimum ${min} %)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$total" -ge "$min" ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.md

  size:
    name: Binary size
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y $DEPS clang-19
      - name: Build small and measure
        # "Small" is a goal, so it is measured. The limit is the measured
        # size with -flto (550 kB of code, with the monitors, XSETTINGS, the reload, the
        # completion of the run dialog and the SYNC resize, with the clipboard and the cursor of the
        # entry, the about dialog, the modes of the dock, the clock of the panel, the configuration files and
        # their writing, the rendering of text published to the X resources, the main menu, the groups and the favorites of the dock, the launcher,
        # the icon grid, the work area, the dialogs, the image decoders, the
        # EWMH policies, shading, the layers, the command line with the WM_Sn selection and the question
        # about applications that do not respond, the window switcher, the timers and the
        # functions of the event handlers, the screen lock: its menu item, its key and the watching
        # of the lock, the idle lock and the black cover of the display, the autostart and the end of
        # the session with its dialog, the keyboard layouts that the shell sets with setxkbmap) with a reserve; change it on purpose.
        run: |
          max=667000
          make CXX=clang++-19 AR=llvm-ar-19 \
              CXXFLAGS="-Os -fno-asynchronous-unwind-tables -DNDEBUG -flto -ffunction-sections -fdata-sections" \
              LDFLAGS="-s -flto -Wl,--gc-sections" build/tiny-shell
          size build/tiny-shell | tee size.txt
          text=$(awk 'NR==2 {print $1}' size.txt)
          echo "code ${text} B (limit ${max} B)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$text" -le "$max" ]
