[plugin]
name = Weather
description = The weather in the panel (open-meteo.com, needs curl); a click opens the details and the forecast for the next days
version = 1.0
author = tiny-shell
url = https://open-meteo.com/
api = 1
enabled = no
settings = location;units;interval

[setting.location]
type = text
label = Location
note = The name of a town, for example Prague

[setting.units]
type = choice
label = Units
choices = metric=Celsius;imperial=Fahrenheit
default = metric

[setting.interval]
type = number
label = Minutes between the updates
min = 10
max = 720
default = 30
