[plugin]
name = Battery
description = The charge of the battery in the panel, and whether it charges
version = 1.0
author = tiny-shell
api = 1
enabled = yes
settings = prefix;interval;low

[setting.prefix]
type = text
label = Text before the charge
note = A short word, or nothing
default = Bat

[setting.interval]
type = number
label = Seconds between the checks
min = 5
max = 600
default = 30

[setting.low]
type = number
label = Warn below (percent)
note = A "!" is shown under this charge, 0 turns it off
min = 0
max = 100
default = 15
