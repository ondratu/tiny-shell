[plugin]
name = Battery
description = The battery in the panel: an icon that follows the charge, with a bolt while it is on mains
version = 1.0
author = tiny-shell
api = 1
enabled = yes
settings = percent;interval

[setting.percent]
type = bool
label = Show the percentage
note = Next to the icon
default = yes

[setting.interval]
type = number
label = Seconds between the checks
min = 5
max = 600
default = 30
