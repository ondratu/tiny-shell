[plugin]
name = System monitor
description = The load of the processor, the memory, the swap and the network in the panel
version = 1.0
author = tiny-shell
api = 1
enabled = no
settings = cpu;memory;swap;download;upload;network_as;link;interval

[setting.cpu]
type = bool
label = Show the processor
note = The load of all the processors together
default = yes

[setting.memory]
type = bool
label = Show the memory
note = How much of it the programs use; the cache does not count
default = yes

[setting.swap]
type = bool
label = Show the swap
note = Not shown on a computer that has no swap
default = yes

[setting.download]
type = bool
label = Show the download
note = The speed of receiving of all the adapters together, without the loopback
default = yes

[setting.upload]
type = bool
label = Show the upload
note = The speed of sending of all the adapters together, without the loopback
default = yes

[setting.network_as]
type = choice
label = Show the network as
choices = speed=Speed (KB/s, MB/s);percent=Percent of the link
default = speed

[setting.link]
type = number
label = Speed of the link, Mbit/s
note = What 100 % of the network is, when it is shown in percent
min = 1
max = 100000
default = 1000

[setting.interval]
type = number
label = Seconds between the checks
min = 1
max = 60
default = 2
