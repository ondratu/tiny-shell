[plugin]
name = Network
description = The network in the panel: Ethernet and Wi-Fi with the signal; a click lists the adapters with their addresses and the Wi-Fi networks in range
version = 1.0
author = tiny-shell
api = 1
enabled = yes
settings = ssid;interval

[setting.ssid]
type = bool
label = Show the name of the Wi-Fi
note = Next to the icon
default = no

[setting.interval]
type = number
label = Seconds between the checks
min = 3
max = 600
default = 10
