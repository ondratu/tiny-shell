; A plugin that shows nothing in the panel: it only logs a greeting now and
; then. Copy the directory to ~/.local/share/tiny-shell/plugins/ and switch it
; on in tiny-settings (Plugins), then look at the standard error of tiny-shell
; (the file of the session, ~/.xsession-errors).
[plugin]
name = Hello, hidden
description = Logs a greeting every few seconds. A plugin without a widget.
version = 1.0
author = Your Name
api = 1
; whether it runs before the user chooses
enabled = no
; the settings, in the order of the dialog; each is described below
settings = greeting;seconds;shout

[setting.greeting]
type = text
label = Greeting
note = What the plugin says
default = Hello

[setting.seconds]
type = number
label = Seconds between the greetings
min = 1
max = 3600
default = 10

[setting.shout]
type = bool
label = Say it loud
default = no
