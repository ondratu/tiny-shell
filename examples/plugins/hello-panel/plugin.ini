; A plugin with a button in the panel. Copy the directory to
; ~/.local/share/tiny-shell/plugins/ and switch it on in tiny-settings.
[plugin]
name = Hello, panel
description = A button in the panel that counts the clicks and tells the time of the last one.
version = 1.0
author = Your Name
api = 1
enabled = no
settings = text;format

[setting.text]
type = text
label = Text of the button
default = Hello

[setting.format]
type = choice
label = What a click shows
choices = clicks=Number of clicks;time=Time of the click
default = clicks
