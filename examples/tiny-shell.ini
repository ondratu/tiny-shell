# tiny-shell configuration. Copy it to ~/.config/tiny-shell.ini (or to
# /etc/xdg/tiny-shell.ini for all users; the file of the user wins, key by
# key). Every key is optional, the values here are the defaults.
#
# tiny-shell rewrites the file of the user when the favorites of the dock
# change, and tiny-settings when it saves; then your comments are lost.
#
# A comment is a whole line that starts with # or ;

[theme]
# The scale of the whole theme, a number above 0, up to 16 (2 for high-DPI)
scale = 1
# The family of the font of the shell, the name that tiny-fonts shows
font = Cantarell
# The size in points at the scale 1, from 4 to 96
font_size = 12
# A style that the family has ("Bold", "Italic"...); empty is the default one
font_style =

[xft]
# How the programs draw text. Empty means "not set": the system decides.
# tiny-shell puts it into the X resources Xft.* when it starts (the programs
# that start later use it); tiny-settings does it at once. Not for GTK, which
# has channels of its own.
# yes or no
antialias =
# none, slight, medium or full
hinting =
# The order of the subpixels: none, rgb, bgr, vrgb or vbgr
rgba =

[commands]
# Restart and Shutdown in the main menu; use "sudo reboot", "doas poweroff"
# or similar where there is no systemd
reboot = systemctl reboot
poweroff = systemctl poweroff
# The program that runs the applications with Terminal=true; the command of
# the application follows it. The Terminal item of the main menu starts it
# without the -e at the end.
terminal = xterm -e

[dock]
# Applications that stay in the dock when they do not run: the ids of their
# desktop files (the name of the file in an "applications" directory),
# separated by ;. Right click on an icon of the dock adds or removes one.
favorites =
